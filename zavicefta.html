<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zavicefta Dosage Calculator</title>
    <style>
        body { font-family: sans-serif; margin: 20px; line-height: 1.6; }
        .container { max-width: 500px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; box-shadow: 2px 2px 12px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #bdc3c7; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #219150; }
        #result { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; }
        .footer { margin-top: 30px; text-align: center; font-size: 12px; color: #7f8c8d; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Zavicefta Calculator</h2>
    
    <div class="input-group">
        <label for="patientType">Patient Type:</label>
        <select id="patientType" onchange="toggleInputs()">
            <option value="adult">Adult</option>
            <option value="pediatric">Pediatric (Infants/Children/Adolescents)</option>
        </select>
    </div>

    <div class="input-group">
        <label id="renalLabel" for="renalValue">CrCl (mL/min):</label>
        <input type="number" id="renalValue" placeholder="Enter value">
    </div>

    <div id="pediatricFields" style="display: none;">
        <div class="input-group">
            <label for="ageMonths">Age (Months):</label>
            <input type="number" id="ageMonths" placeholder="Enter age in months">
        </div>
        <div class="input-group">
            <label for="weight">Weight (kg):</label>
            <input type="number" id="weight" placeholder="Enter weight in kg">
        </div>
    </div>

    <button onclick="calculateDose()">Calculate Dose</button>

    <div id="result"></div>

    <div class="footer">
        Made by Clinical Pharmacist Hina Khurram Ghaznavi
    </div>
</div>

<script>
    function toggleInputs() {
        const type = document.getElementById('patientType').value;
        const pedFields = document.getElementById('pediatricFields');
        const renalLabel = document.getElementById('renalLabel');
        
        if (type === 'pediatric') {
            pedFields.style.display = 'block';
            renalLabel.innerText = "eGFR (mL/min/1.73 m²):";
        } else {
            pedFields.style.display = 'none';
            renalLabel.innerText = "CrCl (mL/min):";
        }
    }

    function calculateDose() {
        const type = document.getElementById('patientType').value;
        const renal = parseFloat(document.getElementById('renalValue').value);
        const resultDiv = document.getElementById('result');
        let message = "";

        if (isNaN(renal)) {
            alert("Please enter a valid renal function value.");
            return;
        }

        if (type === 'adult') {
            // Adult Dosing Logic (Based on Image 1)
            if (renal > 50) message = "Standard Dose: 2.5 g every 8 hours (No adjustment necessary).";
            else if (renal > 30) message = "Adjusted Dose: 1.25 g every 8 hours.";
            else if (renal > 15) message = "Adjusted Dose: 0.94 g every 12 hours.";
            else if (renal > 5) message = "Adjusted Dose: 0.94 g every 24 hours.";
            else message = "Adjusted Dose: 0.94 g every 48 hours.";
        } else {
            // Pediatric Dosing Logic (Based on Image 2 & 3)
            const age = parseFloat(document.getElementById('ageMonths').value);
            const weight = parseFloat(document.getElementById('weight').value);

            if (isNaN(age) || isNaN(weight)) {
                alert("Please enter age and weight for pediatric calculation.");
                return;
            }

            if (renal > 50) {
                // Normal Dosing
                let mgPerKg = 0;
                let max = 2000;
                if (age < 3) mgPerKg = 30;
                else if (age < 6) mgPerKg = 40;
                else mgPerKg = 50;

                let calculated = Math.min(mgPerKg * weight, max);
                message = `Dose: ${calculated.toFixed(2)} mg (based on ${mgPerKg}mg/kg) every 8 hours.`;
            } else {
                // Renal Adjusted Pediatric Dosing
                let mgPerKg = 0;
                let freq = "";
                let max = 750;

                if (renal >= 31) { mgPerKg = 25; freq = "8 hours"; max = 1000; }
                else if (renal >= 16) { mgPerKg = 19; freq = "12 hours"; }
                else if (renal >= 6) { mgPerKg = 19; freq = "24 hours"; }
                else { mgPerKg = 19; freq = "48 hours"; }

                let calculated = Math.min(mgPerKg * weight, max);
                message = `Adjusted Dose: ${calculated.toFixed(2)} mg (based on ${mgPerKg}mg/kg) every ${freq}. (Max: ${max}mg)`;
            }
        }

        resultDiv.style.display = 'block';
        resultDiv.style.backgroundColor = '#e8f6ef';
        resultDiv.style.color = '#27ae60';
        resultDiv.innerHTML = `<strong>Result:</strong><br>${message}`;
    }
</script>

</body>
</html>
