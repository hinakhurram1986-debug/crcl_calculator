<!DOCTYPE html>
<html lang="en">
<head>
    <script>
(function() {
    // 1. Define your authorized fingerprints
    // Add the fingerprints of your 2-3 authorized systems here
    const authorizedFingerprints = ["PASTE_FINGERPRINT_1", "PASTE_FINGERPRINT_2"];
    
    // 2. Simple Fingerprinting Function
    function generateFingerprint() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const txt = 'Clinical-Calc-Auth';
        ctx.textBaseline = "top";
        ctx.font = "14px 'Arial'";
        ctx.fillText(txt, 2, 2);
        return btoa(canvas.toDataURL()); // Converts canvas data to a unique string
    }

    const systemFingerprint = generateFingerprint();
    const accessKey = localStorage.getItem('calc_access_token');

    // 3. Authorization Check
    // System is authorized if the fingerprint matches AND the local key is present
    if (!authorizedFingerprints.includes(systemFingerprint) || accessKey !== "AUTHORIZED_LEVEL_1") {
        document.body.innerHTML = `
            <div style="text-align:center; margin-top:100px; font-family:sans-serif;">
                <h2>Access Denied</h2>
                <p>This system is not authorized to use this clinical tool.</p>
                <p style="color:gray; font-size:10px;">ID: ${systemFingerprint}</p>
            </div>`;
        window.stop(); // Stops further execution
    }
})();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Dosage Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .container { max-width: 800px; width: 100%; text-align: center; }
        h1 { color: #1a73e8; margin-bottom: 10px; }
        p { color: #555; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .drug-card { 
            background: white; padding: 20px; border-radius: 12px; text-decoration: none; 
            color: #1a73e8; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #e0e0e0;
        }
        .drug-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); background: #f8fbff; }
        .footer { margin-top: 50px; font-size: 13px; color: #777; border-top: 1px solid #ddd; padding-top: 20px; width: 100%; }
    </style>
