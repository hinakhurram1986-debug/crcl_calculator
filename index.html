<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Dosage Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .container { max-width: 800px; width: 100%; text-align: center; }
        h1 { color: #1a73e8; margin-bottom: 10px; }
        p { color: #555; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .drug-card { 
            background: white; padding: 20px; border-radius: 12px; text-decoration: none; 
            color: #1a73e8; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #e0e0e0;
        }
        .drug-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); background: #f8fbff; }
        .footer { margin-top: 50px; font-size: 13px; color: #777; border-top: 1px solid #ddd; padding-top: 20px; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h1>Clinical Pharmacy Calculators</h1>
    <p>Select a medication to calculate renal-adjusted dosages.</p>

    <div class="grid">
        <a href="meropenem.html" class="drug-card">Meropenem</a>
            </div>

    <div class="footer">
        Made by Clinical Pharmacist Hina Khurram Ghaznavi<br>
        <em>Internal Use Only - Based on UpToDate Guidelines</em>
    </div>
</div>

</body>
</html>
