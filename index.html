<!DOCTYPE html>
<html lang="en">
<head>
    <script>
(function() {
    // --- CONFIGURATION ---
    const correctPassword = "YourCustomPassword123"; // Set your password here
    const siteName = "Creatinine Calculator";
    // ---------------------

    const storageKey = "auth_token_" + btoa(siteName);
    
    function loadAccess() {
        const isAuthorized = localStorage.getItem(storageKey);
        
        if (isAuthorized !== "true") {
            // Hide the actual content until authorized
            document.documentElement.style.display = 'none';
            
            const userEntry = prompt(`Enter Password for ${siteName}:`);
            
            if (userEntry === correctPassword) {
                localStorage.setItem(storageKey, "true");
                document.documentElement.style.display = 'block';
                location.reload(); // Refresh to show content
            } else {
                alert("Incorrect password. Access denied.");
                document.body.innerHTML = "<h1>Unauthorized Access</h1>";
                document.documentElement.style.display = 'block';
                window.stop();
            }
        }
    }

    // Run the check
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", loadAccess);
    } else {
        loadAccess();
    }
})();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
